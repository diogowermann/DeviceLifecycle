name: Apply optional cloud correlation patch

on:
  push:
    branches:
      - fix/optional-cloud-correlation

permissions:
  contents: write

jobs:
  apply-and-test:
    if: github.actor != 'github-actions[bot]' && contains(github.event.head_commit.message, 'run optional cloud correlation patch')
    runs-on: windows-latest

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/optional-cloud-correlation
          fetch-depth: 0

      - name: Validate and apply main script patch
        shell: bash
        run: |
          git apply --check .github/optional-cloud-correlation.patch
          git apply .github/optional-cloud-correlation.patch

      - name: Update configuration and documentation
        shell: bash
        run: python .github/apply_optional_cloud_correlation.py

      - name: Check whitespace and patch integrity
        shell: bash
        run: git diff --check

      - name: Run activity correlation policy tests
        shell: powershell
        run: .\tests\Test-ActivityCorrelationPolicy.ps1

      - name: Commit validated changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Invoke-DeviceLifecycle.ps1 DeviceLifecycle.Config.psd1 README.md README.pt-BR.md docs/en/ARCHITECTURE.md docs/pt-BR/ARCHITECTURE.md CHANGELOG.md
          git commit -m "treat missing cloud records as optional evidence"
          git push origin HEAD:fix/optional-cloud-correlation
